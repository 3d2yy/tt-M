name: docs

on:
  push:
  workflow_dispatch:

jobs:
  docs:
    # Skip the template's auto-generated initial commit (info.yaml is still a placeholder)
    if: ${{ !(github.event.created && github.ref_name == github.event.repository.default_branch && github.event.head_commit.message == 'Initial commit') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install GHDL for VHDL source discovery
        run: sudo apt-get update && sudo apt-get install -y ghdl

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttsky26d
